
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: 'python -m pip install --only-binary=:all: -r requirements_dev.txt'
      - run: python -m pytest test/unit -q

  native:
    runs-on: ubuntu-24.04
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/test/testcases/anotherincludedir
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update
      - run: sudo apt-get install -y g++ clang-18 make libeigen3-dev
      - run: 'python -m pip install --only-binary=:all: -r requirements_dev.txt'
      - run: python -m pytest test -m integration -q
